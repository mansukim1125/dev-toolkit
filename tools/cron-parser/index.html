<template id="cron-parser">
  <script src="https://cdn.jsdelivr.net/npm/croner@8/dist/croner.umd.min.js"></script>
  <h2>Cron Expression Parser</h2>

  <div class="mb-2">
    <label for="cron-input">Cron Expression:</label>
    <input type="text" id="cron-input" placeholder="e.g., */15 * * * * or 0 30 9 * * 1-5">
  </div>

  <div class="mb-2">
    <button onclick="CronParserTool.parse()">Parse</button>
    <button onclick="CronParserTool.clear()">Clear</button>
  </div>

  <div id="cron-error" class="error"></div>

  <div class="mb-2">
    <label>Description:</label>
    <div id="cron-description"></div>
  </div>

  <div class="mb-2">
    <label>Next 5 Executions:</label>
    <ul id="cron-schedule"></ul>
  </div>

  <div>
    <button onclick="CronParserTool.copy()">Copy</button>
  </div>

  <script src="./src/main.js"></script>
</template>
