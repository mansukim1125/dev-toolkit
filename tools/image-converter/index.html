<template id="image-converter">
  <h2>Image Converter</h2>

  <!-- File Input Section -->
  <div class="mb-2">
    <label>Select or Drop Image:</label>
    <div id="drop-zone">
      <p>Drag & drop an image here, or click to select</p>
      <p style="color: #888; font-size: 0.9em;">Supports PNG, JPG, WebP</p>
      <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp" style="display: none;">
    </div>
  </div>

  <!-- Original Image Info -->
  <div id="image-info" class="mb-2" style="display: none;">
    <strong>Original:</strong> <span id="original-info"></span>
  </div>

  <!-- Preview Section -->
  <div class="grid-2col mb-2">
    <div class="grid-item">
      <label>Original Preview:</label>
      <div class="preview-container">
        <img id="preview-img" style="max-width: 100%; display: none;">
      </div>
    </div>
    <div class="grid-item">
      <label>Converted Preview:</label>
      <div class="preview-container">
        <img id="output-img" style="max-width: 100%; display: none;">
      </div>
    </div>
  </div>

  <!-- Conversion Options -->
  <div class="grid-2col mb-2">
    <div class="grid-item">
      <label for="output-format">Output Format:</label>
      <select id="output-format">
        <option value="image/png">PNG</option>
        <option value="image/jpeg">JPG</option>
        <option value="image/webp">WebP</option>
      </select>
    </div>
    <div class="grid-item">
      <label for="quality">Quality (JPG/WebP): <span id="quality-value">90</span>%</label>
      <input type="range" id="quality" min="1" max="100" value="90" style="width: 100%;">
    </div>
  </div>

  <!-- Resize Options -->
  <div class="mb-2">
    <label style="cursor: pointer;">
      <input type="checkbox" id="resize-enabled"> Enable Resize
    </label>
  </div>
  <div id="resize-options" class="grid-2col mb-2" style="display: none;">
    <div class="grid-item">
      <label for="resize-width">Width (px):</label>
      <input type="number" id="resize-width" min="1" placeholder="Width">
    </div>
    <div class="grid-item">
      <label for="resize-height">Height (px):</label>
      <input type="number" id="resize-height" min="1" placeholder="Height">
    </div>
    <div class="grid-item" style="grid-column: span 2;">
      <label style="cursor: pointer;">
        <input type="checkbox" id="maintain-aspect" checked> Maintain Aspect Ratio
      </label>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="mb-2">
    <button onclick="ImageConverterTool.convert()">Convert</button>
    <button onclick="ImageConverterTool.download()">Download</button>
    <button onclick="ImageConverterTool.clear()">Clear</button>
  </div>

  <!-- Error Display -->
  <div id="error" class="error"></div>

  <!-- Output Info -->
  <div id="output-info" class="mb-2" style="display: none;">
    <strong>Converted:</strong> <span id="converted-info"></span>
  </div>

  <!-- Hidden Canvas for Processing -->
  <canvas id="canvas" style="display: none;"></canvas>

  <style>
    #drop-zone {
      border: 2px dashed #ccc;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }
    #drop-zone:hover {
      border-color: #007bff;
    }
    #drop-zone.dragover {
      border-color: #007bff;
      background-color: #f0f8ff;
    }
    .preview-container {
      max-height: 200px;
      overflow: auto;
      border: 1px solid #ccc;
      padding: 5px;
      min-height: 50px;
    }
  </style>

  <script src="./src/main.js"></script>
</template>
