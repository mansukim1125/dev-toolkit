<template id="json-xml-compare">
  <h2>JSON/XML Compare</h2>
  <div class="grid-2col">
    <div class="grid-item">
      <h3>Left Side</h3>
      <div class="mb-1">
        <label for="left-format">Format:
          <select id="left-format">
            <option value="json">JSON</option>
            <option value="xml">XML</option>
          </select>
        </label>
      </div>
      <div>
        <textarea id="left-input" placeholder="Enter JSON or XML..."></textarea>
      </div>
    </div>
    <div class="grid-item">
      <h3>Right Side</h3>
      <div class="mb-1">
        <label for="right-format">Format:
          <select id="right-format">
            <option value="json">JSON</option>
            <option value="xml">XML</option>
          </select>
        </label>
      </div>
      <div>
        <textarea id="right-input" placeholder="Enter JSON or XML..."></textarea>
      </div>
    </div>
  </div>
  <div class="mt-2">
    <button onclick="JsonXmlCompareTool.compare()">Compare</button>
    <button onclick="JsonXmlCompareTool.clear()">Clear</button>
  </div>
  <div id="compare-error" class="error mt-2"></div>
  <div class="mt-2">
    <h3>Comparison Result</h3>
    <div id="compare-result" style="border: 1px solid #ccc; padding: 10px; min-height: 100px; background-color: #f9f9f9; border-radius: 4px;"></div>
  </div>
  <script src="./src/main.js"></script>
</template>
