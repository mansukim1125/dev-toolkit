<template id="json-xml-compare">
  <h2>JSON/XML Compare</h2>
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
    <div>
      <h3>Left Side</h3>
      <div>
        <label>Format:
          <select id="left-format">
            <option value="json">JSON</option>
            <option value="xml">XML</option>
          </select>
        </label>
      </div>
      <div>
        <textarea id="left-input" rows="15" cols="50" placeholder="Enter JSON or XML..."></textarea>
      </div>
    </div>
    <div>
      <h3>Right Side</h3>
      <div>
        <label>Format:
          <select id="right-format">
            <option value="json">JSON</option>
            <option value="xml">XML</option>
          </select>
        </label>
      </div>
      <div>
        <textarea id="right-input" rows="15" cols="50" placeholder="Enter JSON or XML..."></textarea>
      </div>
    </div>
  </div>
  <div style="margin-top: 20px;">
    <button onclick="JsonXmlCompareTool.compare()">Compare</button>
    <button onclick="JsonXmlCompareTool.clear()">Clear</button>
  </div>
  <div id="compare-error" style="color:red; margin-top: 10px;"></div>
  <div style="margin-top: 20px;">
    <h3>Comparison Result</h3>
    <div id="compare-result" style="border: 1px solid #ccc; padding: 10px; min-height: 100px; background-color: #f9f9f9;"></div>
  </div>
  <script src="./src/main.js"></script>
</template>
