<template id="env-converter">
  <h2>IntelliJ Env ↔ .env Converter</h2>
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
    <div>
      <div>IntelliJ Format (semicolon-separated):</div>
      <textarea id="intellij-input" rows="10" cols="50" placeholder="KEY1=value1;KEY2=value2;KEY3=value3"></textarea>
      <div style="margin-top: 10px;">
        <button onclick="EnvConverterTool.convertToEnv()">IntelliJ → .env</button>
        <button onclick="EnvConverterTool.copyIntellij()">Copy</button>
      </div>
    </div>
    <div>
      <div>.env Format (newline-separated):</div>
      <textarea id="dotenv-input" rows="10" cols="50" placeholder="KEY1=value1&#10;KEY2=value2&#10;KEY3=value3"></textarea>
      <div style="margin-top: 10px;">
        <button onclick="EnvConverterTool.convertToIntellij()">.env → IntelliJ</button>
        <button onclick="EnvConverterTool.copyDotenv()">Copy</button>
      </div>
    </div>
  </div>
  <div style="margin-top: 10px;">
    <button onclick="EnvConverterTool.clear()">Clear All</button>
  </div>
  <div id="error" style="color:red; margin-top: 10px;"></div>
  <script src="./src/main.js"></script>
</template>
