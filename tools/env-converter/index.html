<template id="env-converter">
  <h2>IntelliJ Env ↔ .env Converter</h2>
  <div class="grid-2col">
    <div class="grid-item">
      <label for="intellij-input">IntelliJ Format (semicolon-separated):</label>
      <textarea id="intellij-input" placeholder="KEY1=value1;KEY2=value2;KEY3=value3"></textarea>
      <div class="mt-2">
        <button onclick="EnvConverterTool.convertToEnv()">IntelliJ → .env</button>
        <button onclick="EnvConverterTool.copyIntellij()">Copy</button>
      </div>
    </div>
    <div class="grid-item">
      <label for="dotenv-input">.env Format (newline-separated):</label>
      <textarea id="dotenv-input" placeholder="KEY1=value1&#10;KEY2=value2&#10;KEY3=value3"></textarea>
      <div class="mt-2">
        <button onclick="EnvConverterTool.convertToIntellij()">.env → IntelliJ</button>
        <button onclick="EnvConverterTool.copyDotenv()">Copy</button>
      </div>
    </div>
  </div>
  <div class="mt-2">
    <button onclick="EnvConverterTool.clear()">Clear All</button>
  </div>
  <div id="error" class="error mt-2"></div>
  <script src="./src/main.js"></script>
</template>
