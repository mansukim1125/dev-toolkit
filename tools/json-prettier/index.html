<template id="json-prettier">
  <h2>JSON Prettier</h2>
  <div class="mb-2">
    <label for="json-input">Input JSON:</label>
    <textarea id="json-input" placeholder="Enter JSON..."></textarea>
  </div>
  <div class="mb-2">
    <label for="indent-size">Indent:
      <select id="indent-size">
        <option value="2" selected>2 spaces</option>
        <option value="4">4 spaces</option>
        <option value="tab">Tab</option>
      </select>
    </label>
    <button onclick="JsonPrettierTool.prettifyJson()">Prettify</button>
    <button onclick="JsonPrettierTool.minifyJson()">Minify</button>
    <button onclick="JsonPrettierTool.clearJson()">Clear</button>
  </div>
  <div id="json-error" class="error"></div>
  <div class="mb-2">
    <label for="json-output">Output:</label>
    <textarea id="json-output" readonly placeholder="Result..."></textarea>
  </div>
  <div>
    <button onclick="JsonPrettierTool.copyJson()">Copy</button>
  </div>
  <script src="./src/main.js"></script>
</template>
