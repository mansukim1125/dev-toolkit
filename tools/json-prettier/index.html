<template id="json-prettier">
  <h2>JSON Prettier</h2>
  <div>
    <div>Input JSON:</div>
    <textarea id="json-input" rows="10" cols="80" placeholder="Enter JSON..."></textarea>
  </div>
  <div>
    <label>Indent:
      <select id="indent-size">
        <option value="2" selected>2 spaces</option>
        <option value="4">4 spaces</option>
        <option value="tab">Tab</option>
      </select>
    </label>
    <button onclick="JsonPrettierTool.prettifyJson()">Prettify</button>
    <button onclick="JsonPrettierTool.minifyJson()">Minify</button>
    <button onclick="JsonPrettierTool.clearJson()">Clear</button>
  </div>
  <div id="json-error" style="color:red"></div>
  <div>
    <div>Output:</div>
    <textarea id="json-output" rows="10" cols="80" readonly placeholder="Result..."></textarea>
  </div>
  <div>
    <button onclick="JsonPrettierTool.copyJson()">Copy</button>
  </div>
  <script src="./src/main.js"></script>
</template>
